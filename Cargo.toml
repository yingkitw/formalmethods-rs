[package]
name = "formalmethods"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/yingkitw/formalmethods-rs"
homepage = "https://github.com/yingkitw/formalmethods-rs"
documentation = "https://docs.rs/formalmethods"
description = "Formal methods for software testing: LTL evaluation on traces, Kripke model checking, property-based falsification, and coverage analysis."
license = "Apache-2.0"
keywords = ["formal-methods", "ltl", "model-checking", "testing", "verification"]
categories = ["development-tools::testing", "algorithms"]
authors = ["Ying Kit WONG"]

[features]
default = ["std"]
## `ltl`, `monitor`, `concepts`, `fuzz` are `no_std`+`alloc`-capable;
## `model` and the `fm` binary need `std` (Instant, HashMap, serde_json).
std = ["serde/std", "dep:serde_json"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", optional = true, features = ["preserve_order"] }

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[[bin]]
name = "fm"
path = "src/bin/fm.rs"
required-features = ["std"]

[[example]]
name = "vending"
required-features = ["std"]
